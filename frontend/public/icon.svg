<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#10b981" stroke-width="12" filter="url(#shadow)"/>

  <!-- Inner Soft Accent Border -->
  <rect x="44" y="44" width="424" height="424" rx="92" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Golden Coin / Indicator Dot over 'i' -->
  <circle cx="170" cy="155" r="34" fill="url(#accentGrad)" filter="url(#shadow)"/>

  <!-- Letter 'i' Stem -->
  <rect x="144" y="215" width="52" height="175" rx="26" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Letter 'P' -->
  <path d="M 245 215 L 340 215 C 385 215 415 245 415 285 C 415 325 385 355 340 355 L 297 355 L 297 390 C 297 404 286 415 272 415 C 258 415 245 404 245 390 Z" fill="#ffffff" filter="url(#shadow)"/>
  <path d="M 297 265 L 335 265 C 355 265 365 273 365 285 C 365 297 355 305 335 305 L 297 305 Z" fill="#064e3b"/>

  <!-- Small Version Badge '4.0' -->
  <rect x="330" y="375" width="120" height="44" rx="22" fill="#022c22" stroke="#10b981" stroke-width="3"/>
  <text x="390" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#34d399" text-anchor="middle">4.0</text>
</svg>
